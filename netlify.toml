# This Netlify site hosts the mobile app's serverless WhatsApp API only.

[build]
  publish = "netlify/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/whatsapp/send"
  to     = "/.netlify/functions/whatsapp-send"
  status = 200

[build.environment]
  NODE_VERSION = "20"
