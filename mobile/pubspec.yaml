name: sri_jayam_travels_mobile
description: Driver and manager mobile app for Sri Jayam Travels.
publish_to: none

version: 1.0.0+46

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  supabase_flutter: ^2.3.4
  connectivity_plus: ^6.1.4
  flutter_slidable: ^4.0.0
  http: ^1.2.2
  intl: ^0.19.0
  # GPS / Location — Day 46
  geolocator: ^13.0.4
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  image_picker: ^1.2.3
  # SOS call-ops + customer call buttons
  url_launcher: ^6.3.1
  # Theme-mode persistence (Settings screen)
  shared_preferences: ^2.5.5
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image: ^4.9.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
